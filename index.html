<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Music Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
/* Layout: one full-bleed canvas showing a cutaway music factory, 8 rooms in a 2x4 (portrait) or 4x2 (landscape) grid.
   A round sound button floats top-right, a start sign sits centre, toasts bottom. Single dark look by design. */
:root{
  --wood:#1c1210; --brass:#e2b25a; --cream:#fff1d6; --ink:#140c0a; --panel:rgba(20,12,10,.88);
  --font-sign:"Bungee","Arial Black","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--wood);color:var(--cream);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:var(--font-sign)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#probe{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);pointer-events:none;visibility:hidden}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:2px solid var(--brass);background:var(--panel);color:var(--brass);font:inherit;font-size:11px;cursor:pointer;z-index:5}
@media (max-width:600px){#mute{width:34px;height:34px;font-size:9px;top:calc(4px + env(safe-area-inset-top,0px));opacity:.9}}
#mute{display:grid;place-items:center;padding:0}
#mute svg{width:62%;height:62%;display:block}
#mute .cross{display:none}
#mute.off .waves{display:none}
#mute.off .cross{display:block}
#mute.off{color:#ff9aa2;border-color:#ff9aa2}
#mute:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:3px solid var(--brass);border-radius:14px;padding:18px 26px;text-align:center;pointer-events:none;z-index:4;box-shadow:0 12px 50px rgba(0,0,0,.6);max-width:calc(100% - 48px)}
#start b{display:block;font-weight:400;font-size:clamp(20px,5vw,34px);color:var(--brass);letter-spacing:.04em}
#start span{display:block;margin:6px 0;font-size:clamp(10px,2.4vw,13px);letter-spacing:.12em;opacity:.85}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:2px solid var(--brass);color:var(--cream);padding:9px 16px;border-radius:999px;font-size:11px;letter-spacing:.08em;opacity:0;transition:opacity .4s;pointer-events:none;z-index:5;max-width:calc(100% - 32px);text-align:center}
#prices{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:3px solid var(--brass);border-radius:12px;padding:16px 20px;z-index:6;min-width:230px;pointer-events:none;font-variant-numeric:tabular-nums}
#prices h3{margin:0 0 8px;font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--brass)}
#prices div{display:flex;justify-content:space-between;gap:18px;font-size:13px;padding:3px 0}
#prices .up{color:#8ef0b0}#prices .dn{color:#ff9aa2}
</style>
<canvas id="c"></canvas>
<div id="probe"></div>
<button id="mute" aria-label="Mute sound" title="Mute sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><g class="waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></g><g class="cross" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
<div id="start"><span>KRIPPY.AI</span><b>Music Box</b><span>TAP TO START THE MUSIC</span></div>
<div id="toast"></div>
<div id="prices" hidden></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),probe=document.getElementById('probe');
const FONT='"Bungee","Arial Black",sans-serif',TAU=Math.PI*2;
if(document.fonts&&document.fonts.load)document.fonts.load('16px Bungee').catch(()=>{});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hsl=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
const hash=i=>{const x=Math.sin(i*127.1+11.7)*43758.5453;return x-Math.floor(x)};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------- rooms ---------------- */
const ROOM={
  clock:{name:'CLOCK ROOM',hue:225,pat:0,lampX:.86,inst:null},
  lead:{name:'AVIARY',hue:185,pat:1,lampX:.1,inst:'lead'},
  arp:{name:'MARBLE RUN',hue:280,pat:2,lampX:.5,inst:'arp'},
  pad:{name:'GLOW GARDEN',hue:135,pat:1,lampX:.12,inst:'pad'},
  kick:{name:'STAMP HALL',hue:5,pat:0,lampX:.3,inst:'kick'},
  bass:{name:'PIPE LOFT',hue:320,pat:2,lampX:.14,inst:'bass'},
  drum:{name:'TIN SHOP',hue:205,pat:0,lampX:.88,inst:'drum'},
  bell:{name:'EXCHANGE',hue:28,pat:1,lampX:.9,inst:'bell'}
};
const INST=['kick','drum','bass','arp','lead','pad','bell'];
const on={kick:true,drum:true,bass:true,arp:true,lead:true,pad:true,bell:true};
const lit={};INST.forEach(k=>lit[k]=on[k]?1:0);
let W,H,DPR,safe={x:0,y:0,w:0,h:0},wall=8,band=30,ORDER=[],cols=2,rows=4;
function layout(){
  const c=cv.getBoundingClientRect(),r=probe.getBoundingClientRect();
  DPR=Math.min(devicePixelRatio||1,2);W=c.width||innerWidth;H=c.height||innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  safe={x:r.left,y:r.top,w:r.width||W,h:r.height||H};
  cols=safe.w/safe.h>1.15?4:2;rows=8/cols;
  wall=Math.max(8,Math.min(safe.w,safe.h)*.022);
  ORDER=cols===4?['clock','lead','arp','pad','kick','bass','drum','bell']:['clock','lead','arp','pad','bass','drum','kick','bell'];
  band=clamp(Math.min(safe.w,safe.h)*.055,28,46);
  const cw=(safe.w-wall*(cols+1))/cols,ch=(safe.h-band-wall*rows)/rows;
  ORDER.forEach((id,i)=>{const R=ROOM[id];R.id=id;R.x=safe.x+wall+(i%cols)*(cw+wall);R.y=safe.y+band+Math.floor(i/cols)*(ch+wall);R.w=cw;R.h=ch;R.fy=ch-ch*.09});
}
/* iOS can report old sizes during resize/rotation, so compare against what is actually on screen. */
function fit(){
  const c=cv.getBoundingClientRect(),r=probe.getBoundingClientRect();
  if((c.width&&c.width!==W)||(c.height&&c.height!==H)||r.left!==safe.x||r.top!==safe.y||(r.width||W)!==safe.w||(r.height||H)!==safe.h||Math.min(devicePixelRatio||1,2)!==DPR)layout();
}
addEventListener('resize',fit);layout();

/* ---------------- the tune ---------------- */
const NOTES=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
function makeTune(seed,num){
  const r=mulberry(seed),pick=a=>a[Math.floor(r()*a.length)];
  const minor=r()<.6;
  const sc=minor?pick([[0,2,3,5,7,8,10],[0,2,3,5,7,9,10]]):pick([[0,2,4,5,7,9,11],[0,2,4,5,7,9,10]]);
  const prog=minor?pick([[0,5,2,6],[0,3,5,4],[0,5,3,6],[0,2,3,5]]):pick([[0,4,5,3],[0,5,3,4],[0,3,0,4],[5,3,0,4]]);
  const root=36+Math.floor(r()*8);
  const mid=(d,o)=>root+12*o+sc[((d%7)+7)%7]+12*Math.floor(d/7);
  const P={kick:[],snare:[],hat:[],bass:[],arp:[],lead:[],pad:[],bell:[]};
  const kp=pick([[0,4,8,12],[0,6,8,14],[0,3,8,11],[0,4,8,10,12]]);
  const br=pick([[0,3,6,8,11,14],[0,4,6,8,12,14],[0,2,4,8,10,12],[0,6,8,14]]);
  const ar=pick([[0,2,4,6,8,10,12,14],[0,2,3,5,6,8,10,11,13,14],[0,3,6,8,11,14],[0,1,2,4,6,8,9,10,12,14]]);
  const adir=pick([0,1,2]),TONES=[0,2,4,7,9,11],UD=[0,1,2,3,4,3,2,1];
  const bp=pick([[2,10],[6,14],[3,11],[7,15]]);
  const uniq=[...new Set(prog)];
  const motif=()=>{const m=[];let d=0;for(let s=0;s<16;s+=2){if(s===0||r()<.6)m.push({s,d});d+=pick([-2,-1,-1,1,1,2])}return m};
  const A=motif(),B=motif(),C=motif(),bars=[A,B,A,C];
  let ak=0;
  for(let bar=0;bar<4;bar++){
    const c=prog[bar],o=bar*16,cc=c>3?c-7:c;
    kp.forEach(s=>P.kick[o+s]=1);
    P.snare[o+4]=1;P.snare[o+12]=1;if(bar===3&&r()<.7)P.snare[o+15]=1;
    for(let s=0;s<16;s++){if(s%2===0)P.hat[o+s]=1;else if(r()<.18)P.hat[o+s]=1}
    if(r()<.6)P.hat[o+14]=2;
    br.forEach((s,i)=>{const last=i===br.length-1&&r()<.6;const nxt=i<br.length-1?br[i+1]:16;
      P.bass[o+s]={m:last?mid(c+4,0):mid(c,0),i:last?Math.min(4,uniq.length):uniq.indexOf(c),d:Math.min(nxt-s,3)*.9}});
    ar.forEach(s=>{const ti=adir===0?ak%4:adir===1?UD[ak%8]:Math.floor(r()*6);ak++;P.arp[o+s]={m:mid(c+TONES[ti],2),i:ti}});
    const M=bars[bar];
    M.forEach((n,i)=>{let deg=clamp(9+cc+n.d,5,16);if(bar===3&&i===M.length-1)deg=7+((prog[0]%7)+7)%7;
      const nxt=i<M.length-1?M[i+1].s:16;
      P.lead[o+n.s]={m:mid(deg,1),d:Math.min(nxt-n.s,6)*.92,i:clamp(Math.floor((deg-5)/2),0,5)}});
    P.pad[o]={ms:[mid(c,1),mid(c+2,1),mid(c+4,1),mid(c+7,1)],d:16,bar};
    bp.forEach(s=>{if(r()<.8)P.bell[o+s]={m:mid(c+pick([0,2,4]),3)}});
  }
  return{P,bpm:92+Math.floor(r()*26),name:NOTES[root%12]+(minor?' MINOR':' MAJOR'),num};
}
const today=new Date(),doy=Math.floor((today-new Date(today.getFullYear(),0,0))/864e5);
const dayKey=today.getFullYear()+'-'+doy;
let tune=makeTune(today.getFullYear()*1000+doy,doy);

/* ---------------- clock ---------------- */
let AC=null,bpm=tune.bpm,stepDur=60/bpm/4,songStart=performance.now()/1000,nextStep=0,T=0,P=0;
const now=()=>AC?AC.currentTime:performance.now()/1000;
const pos=()=>(now()-songStart)/stepDur;
const mkt={BTC:0,ETH:0,SOL:0,HYPE:0,price:{},ok:false};
function applyTempo(){const p=pos();bpm=tune.bpm+clamp(mkt.BTC,-8,8)*.75;stepDur=60/bpm/4;songStart=now()-p*stepDur;if(del)del.delayTime.value=stepDur*3}
function LH(a){for(let s=Math.floor(P),i=0;i<20;i++,s--){const n=a[((s%64)+64)%64];if(n)return{n,s,age:(P-s)*stepDur}}return null}
function NH(a){for(let s=Math.ceil(P),i=0;i<20;i++,s++){if(a[((s%64)+64)%64])return(s-P)*stepDur}return 9}

/* ---------------- audio ---------------- */
let master=null,rev=null,del=null,fb=null,noise=null,muted=false;const ch={};
const REV={kick:0,drum:.15,bass:0,arp:.35,lead:.4,pad:.5,bell:.6},DEL={kick:0,drum:0,bass:0,arp:.3,lead:.25,pad:0,bell:.3};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  const p=pos();
  AC=new(window.AudioContext||window.webkitAudioContext)();
  songStart=AC.currentTime-p*stepDur;nextStep=Math.ceil(p+.5);
  master=AC.createGain();master.gain.value=muted?0:.8;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  master.connect(comp);comp.connect(AC.destination);
  const len=Math.floor(AC.sampleRate*2.4),ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  rev=AC.createConvolver();rev.buffer=ir;const rg=AC.createGain();rg.gain.value=.5;rev.connect(rg);rg.connect(master);
  del=AC.createDelay(1);del.delayTime.value=stepDur*3;fb=AC.createGain();fb.gain.value=clamp(.35+mkt.SOL*.01,.2,.5);
  const df=AC.createBiquadFilter();df.type='lowpass';df.frequency.value=2500;del.connect(df);df.connect(fb);fb.connect(del);df.connect(master);
  noise=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  for(const k of INST){const g=AC.createGain();g.gain.value=on[k]?1:0;g.connect(master);
    const a=AC.createGain();a.gain.value=REV[k];g.connect(a);a.connect(rev);
    const b=AC.createGain();b.gain.value=DEL[k];g.connect(b);b.connect(del);ch[k]=g}
  setInterval(sched,25);
}
function sched(){
  if(!AC)return;
  if(songStart+nextStep*stepDur<AC.currentTime-.05)nextStep=Math.ceil(pos()+.01);
  while(songStart+nextStep*stepDur<AC.currentTime+.12){playStep(nextStep,Math.max(AC.currentTime,songStart+nextStep*stepDur));nextStep++}
}
function osc(type,f,t,dur,dest){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(t+dur);return o}
function vca(t,a,d,peak,dest){const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);g.connect(dest);return g}
function nz(t,dur,dest){const n=AC.createBufferSource();n.buffer=noise;n.connect(dest);n.start(t,Math.random()*.5);n.stop(t+dur)}
function filt(type,f,q,dest){const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;b.connect(dest);return b}
function playStep(k,t){
  const s=((k%64)+64)%64,Q=tune.P;
  if(Q.kick[s]){const g=vca(t,.002,.3,.95,ch.kick);const o=osc('sine',150,t,.36,g);o.frequency.exponentialRampToValueAtTime(42,t+.13)}
  if(Q.snare[s]){nz(t,.2,filt('bandpass',1900,.8,vca(t,.001,.17,.5,ch.drum)));osc('triangle',190,t,.1,vca(t,.001,.09,.3,ch.drum))}
  if(Q.hat[s]){const op=Q.hat[s]===2;nz(t,.3,filt('highpass',7500,.5,vca(t,.001,op?.22:.045,op?.16:.12,ch.drum)))}
  const b=Q.bass[s];
  if(b){const d=b.d*stepDur,cut=clamp(420+mkt.ETH*25,260,800),g=vca(t,.008,d,.4,ch.bass),f=filt('lowpass',cut,5,g);
    f.frequency.setValueAtTime(cut*2.6,t);f.frequency.exponentialRampToValueAtTime(cut,t+.18);
    osc('sawtooth',mtof(b.m),t,d+.06,f);const sg=AC.createGain();sg.gain.value=.7;sg.connect(g);osc('sine',mtof(b.m),t,d+.06,sg)}
  const a=Q.arp[s];
  if(a){const f=mtof(a.m);osc('sine',f,t,.46,vca(t,.003,.4,.2,ch.arp));osc('sine',f*4,t,.16,vca(t,.002,.12,.06,ch.arp))}
  const l=Q.lead[s];
  if(l){const d=l.d*stepDur,f=mtof(l.m),g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.17,t+.025);g.gain.setValueAtTime(.17,t+d);g.gain.linearRampToValueAtTime(.0001,t+d+.14);g.connect(ch.lead);
    const lp=filt('lowpass',2400,1,g),o1=osc('triangle',f,t,d+.16,lp),sq=AC.createGain();sq.gain.value=.22;sq.connect(lp);const o2=osc('square',f,t,d+.16,sq);
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.007,t+.2);lfo.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);lfo.start(t);lfo.stop(t+d+.16)}
  const pd=Q.pad[s];
  if(pd){const d=pd.d*stepDur,g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+.5);g.gain.setValueAtTime(.05,t+d-.2);g.gain.linearRampToValueAtTime(.0001,t+d+.5);g.connect(ch.pad);
    const lp=filt('lowpass',1100,.7,g);pd.ms.forEach(m=>{osc('sawtooth',mtof(m),t,d+.55,lp).detune.value=8;osc('sawtooth',mtof(m),t,d+.55,lp).detune.value=-8})}
  const be=Q.bell[s];
  if(be){const f=mtof(be.m);osc('sine',f,t,1.2,vca(t,.002,1.1,.13,ch.bell));osc('sine',f*2.76,t,.6,vca(t,.002,.5,.05,ch.bell))}
}
function blip(f,f2){if(!AC||muted)return;const t=AC.currentTime,g=vca(t,.003,.16,.18,master),o=osc('triangle',f,t,.2,g);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+.12)}

/* ---------------- market signal (drives tempo, tone, echo, glow) ---------------- */
try{fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,hyperliquid&vs_currencies=usd&include_24hr_change=true')
  .then(r=>r.json()).then(j=>{const m={BTC:'bitcoin',ETH:'ethereum',SOL:'solana',HYPE:'hyperliquid'};
    for(const k in m){const o=j[m[k]];if(o){mkt[k]=o.usd_24h_change||0;mkt.price[k]=o.usd}}
    mkt.ok=true;applyTempo();if(fb)fb.gain.value=clamp(.35+mkt.SOL*.01,.2,.5)}).catch(()=>{})}catch(e){}

/* ---------------- daily hunt ---------------- */
const hr=mulberry(today.getFullYear()*1000+doy+77);
const hunt={room:['lead','arp','pad','kick','bass','drum','bell','clock'][Math.floor(hr()*8)],fx:.2+hr()*.6,found:false};
let streak={n:0,last:null};
try{const s=JSON.parse(localStorage.getItem('tw-streak'));if(s&&typeof s.n==='number')streak=s}catch(e){}
if(streak.last===dayKey)hunt.found=true;

/* ---------------- drawing helpers ---------------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,r));else ctx.rect(x,y,w,h)}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU)}
function hgrad(x0,x1,a,b,c){const g=ctx.createLinearGradient(x0,0,x1,0);g.addColorStop(0,a);g.addColorStop(.45,b);g.addColorStop(1,c);return g}
function glow(x,y,r,col,a){if(a<=0||r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('ALPHA',a));g.addColorStop(1,col.replace('ALPHA',0));ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalCompositeOperation='source-over'}
function gear(x,y,r,n,rot,col,col2){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<n;i++){const a=i/n*TAU,b=TAU/n;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a+b*.25)*r*1.2,Math.sin(a+b*.25)*r*1.2);ctx.lineTo(Math.cos(a+b*.55)*r*1.2,Math.sin(a+b*.55)*r*1.2);ctx.lineTo(Math.cos(a+b*.8)*r,Math.sin(a+b*.8)*r)}
  ctx.closePath();ctx.fill();ctx.fillStyle=col2;circ(0,0,r*.6);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=r*.16;for(let i=0;i<3;i++){ctx.rotate(TAU/6);ctx.beginPath();ctx.moveTo(-r*.6,0);ctx.lineTo(r*.6,0);ctx.stroke()}
  ctx.fillStyle=col;circ(0,0,r*.22);ctx.fill();ctx.restore()}
function bot(x,y,s,hue,o){

  if(g>.04){glow(bx,ct-br*.6,m*.4,'rgba(255,225,130,ALPHA)',g*.6);ctx.strokeStyle=`rgba(255,240,180,${g})`;ctx.lineWidth=Math.max(1,m*.01);for(let j=0;j<3;j++){const q=(age*1.2+j*.3)%1;ctx.globalAlpha=(1-q)*g;ctx.beginPath();ctx.arc(bx,ct-br*.6,br*(1.3+q*2),-2.6,-.5);ctx.stroke()}ctx.globalAlpha=1}
  const tx=w*.5,tr=m*.065;ctx.fillStyle='#3a2416';rr(tx-tr*1.2,ct-tr*.5,tr*2.4,tr*.5,tr*.1);ctx.fill();
  gear(tx,ct-tr*1.2,tr*.5,8,o?P*TAU/16:0,'#c9973f','#4a3418');
  ctx.fillStyle='rgba(210,240,255,.12)';ctx.strokeStyle='rgba(220,245,255,.6)';ctx.lineWidth=Math.max(1,m*.01);ctx.beginPath();ctx.arc(tx,ct-tr*.5,tr,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='#fff8e6';ctx.lineWidth=Math.max(2,m*.03);ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(tx+tr,ct-tr*.7);ctx.quadraticCurveTo(tx+tr*3,ct-tr*.8,tx+tr*3.2,fy-m*.02);ctx.stroke();
  ctx.strokeStyle='#3a2416';ctx.lineWidth=Math.max(1,m*.008);ctx.setLineDash([m*.012,m*.02]);ctx.lineDashOffset=o?-P*m*.012:0;ctx.beginPath();ctx.moveTo(tx+tr,ct-tr*.7);ctx.quadraticCurveTo(tx+tr*3,ct-tr*.8,tx+tr*3.2,fy-m*.02);ctx.stroke();ctx.setLineDash([]);
  bot(w*.84,fy,m*.24,215,{sleep:1-L,bob:k,face:-1,arm:-1.1+g*.5});
}
ROOM.clock.draw=drawClock;ROOM.kick.draw=drawKick;ROOM.drum.draw=drawDrum;ROOM.bass.draw=drawBass;ROOM.arp.draw=drawArp;ROOM.lead.draw=drawLead;ROOM.pad.draw=drawPad;ROOM.bell.draw=drawBell;
function mouse(R){
  const m=Math.min(R.w,R.h),x=R.w*hunt.fx,y=R.fy,s=Math.max(4,m*.045),tw=Math.sin(T*6)*.5;
  ctx.strokeStyle='#a8a099';ctx.lineWidth=s*.14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-s*.9,y-s*.2);ctx.quadraticCurveTo(x-s*1.6,y-s*.2-tw*s,x-s*1.9,y-s*.9);ctx.stroke();
  ctx.fillStyle='#a8a099';ctx.beginPath();ctx.ellipse(x,y,s,s*.75,0,Math.PI,TAU);ctx.fill();circ(x+s*.55,y-s*.75,s*.32);ctx.fill();
  ctx.fillStyle='#f0aebb';circ(x+s*.55,y-s*.75,s*.17);ctx.fill();circ(x+s*1.02,y-s*.2,s*.09);ctx.fill();ctx.fillStyle='#111';circ(x+s*.75,y-s*.38,s*.09);ctx.fill();
}

/* ---------------- frame ---------------- */
let hover=null;
function frame(){
  requestAnimationFrame(frame);fit();T=now();P=pos();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const wg=ctx.createLinearGradient(0,0,W,H);wg.addColorStop(0,'#2a1a14');wg.addColorStop(1,'#140c0a');ctx.fillStyle=wg;ctx.fillRect(0,0,W,H);
  for(const id of ORDER){const R=ROOM[id],k=R.inst;let L=1;if(k){lit[k]+=((on[k]?1:0)-lit[k])*.12;L=lit[k]}
    ctx.save();ctx.translate(R.x,R.y);rr(0,0,R.w,R.h,wall*.5);ctx.clip();
    roomBG(R);ctx.save();R.draw(R,L);ctx.restore();if(hunt.room===id&&!hunt.found)mouse(R);roomFG(R,L);
    if(R.rip>0){ctx.strokeStyle=`rgba(255,240,190,${R.rip})`;ctx.lineWidth=3;circ(R.rx,R.ry,(1-R.rip)*Math.max(R.w,R.h)*.7);ctx.stroke();R.rip-=.04}
    ctx.restore();
    ctx.strokeStyle=hover===id?'#ffe2a0':'#7a5527';ctx.lineWidth=hover===id?3:2;rr(R.x,R.y,R.w,R.h,wall*.5);ctx.stroke();}
  const ch=(safe.h-band-wall*rows)/rows,sp=Math.max(16,wall*2.2),n=Math.floor(safe.w/sp),st=Math.floor(P),br=Math.max(1.6,wall*.2);
  const bp=((P/4)%1+1)%1,bpulse=Math.pow(1-bp,2),fs=band*.6,sx=safe.x+safe.w/2,sy=safe.y+band/2;
  ctx.font=`${fs}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';const sw=ctx.measureText('KRIPPY.AI').width;
  ctx.fillStyle='#120b09';rr(sx-sw/2-fs*.7,safe.y+band*.08,sw+fs*1.4,band*.84,band*.2);ctx.fill();ctx.strokeStyle='#e2b25a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.shadowColor='#ff8a2a';ctx.shadowBlur=fs*(.35+.55*bpulse);ctx.fillStyle=hsl(42,100,74+bpulse*14);ctx.fillText('KRIPPY.AI',sx,sy+fs*.05);ctx.shadowBlur=0;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  for(let r=0;r<=rows;r++){const y=r===0?sy:safe.y+band-wall/2+r*(ch+wall);
    for(let j=0;j<n;j++){const x=safe.x+(safe.w-(n-1)*sp)/2+j*sp,q=(((r%2?j:-j)-st)%4+4)%4===0;if(r===0&&Math.abs(x-sx)<sw/2+fs*.7+br*3)continue;
      ctx.fillStyle=q?'#fff0b0':'#6b4a25';circ(x,y,br);ctx.fill();if(q){ctx.fillStyle='rgba(255,210,110,.28)';circ(x,y,br*2.6);ctx.fill()}}}
}
requestAnimationFrame(frame);

/* ---------------- input ---------------- */
const toastEl=document.getElementById('toast'),startEl=document.getElementById('start'),muteEl=document.getElementById('mute'),pricesEl=document.getElementById('prices');
let toastT,pricesT,started=false;
function toast(s,ms){toastEl.textContent=s;toastEl.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.style.opacity=0,ms||3200)}
function roomAt(x,y){for(const id of ORDER){const R=ROOM[id];if(x>=R.x&&x<=R.x+R.w&&y>=R.y&&y<=R.y+R.h)return R}return null}
function showPrices(){
  if(!mkt.ok){toast('THE GAUGES ARE WAITING FOR A SIGNAL');return}
  const drives={BTC:'tempo',ETH:'bass tone',SOL:'echo',HYPE:'glow'};let html='<h3>TODAY ON THE GAUGES</h3>';
  for(const k of ['BTC','ETH','SOL','HYPE']){const c=mkt[k],p=mkt.price[k]||0;html+=`<div><span>${k} · ${drives[k]}</span><span class="${c>=0?'up':'dn'}">$${p>=100?Math.round(p).toLocaleString():p.toFixed(2)} ${c>=0?'+':'−'}${Math.abs(c).toFixed(1)}%</span></div>`}
  pricesEl.innerHTML=html;pricesEl.hidden=false;clearTimeout(pricesT);pricesT=setTimeout(()=>pricesEl.hidden=true,6000);
}
function unlock(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!AC){try{initAudio()}catch(err){}}
  if(AC&&AC.state!=='running'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{})}
}
['pointerup','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){const R=roomAt(e.clientX,e.clientY);hover=R?R.id:null}});
cv.addEventListener('pointerleave',()=>hover=null);
cv.addEventListener('pointerdown',e=>{
  fit();unlock();
  if(!started){started=true;startEl.hidden=true;toast('TAP A ROOM TO SEND IT TO SLEEP OR WAKE IT · TAP THE CLOCK FOR A NEW TUNE',5200);return}
  const R=roomAt(e.clientX,e.clientY);if(!R)return;
  const lx=e.clientX-R.x,ly=e.clientY-R.y,m=Math.min(R.w,R.h);
  if(hunt.room===R.id&&!hunt.found&&Math.hypot(lx-R.w*hunt.fx,ly-R.fy)<Math.max(24,m*.11)){
    hunt.found=true;if(streak.last!==dayKey){const prev=streak.last?streak.last.split('-').map(Number):null;const consecutive=prev&&((prev[0]===today.getFullYear()&&prev[1]===doy-1)||(prev[0]===today.getFullYear()-1&&doy===1));streak={n:consecutive?streak.n+1:1,last:dayKey};try{localStorage.setItem('tw-streak',JSON.stringify(streak))}catch(err){}}
    blip(1400,2400);R.rip=1;R.rx=lx;R.ry=ly;toast(`YOU FOUND TODAY'S MOUSE · ${streak.n} DAY STREAK`);return}
  R.rip=1;R.rx=lx;R.ry=ly;
  if(R.id==='clock'){const num=1+Math.floor(Math.random()*999);tune=makeTune((Math.random()*1e9)|0,num);applyTempo();R.flash=1;blip(660,1320);toast(`TUNE ${num} · ${tune.name} · ${Math.round(bpm)} BPM`);return}
  if(R.id==='bell'&&R.plq&&lx>=R.plq.x-6&&lx<=R.plq.x+R.plq.w+6&&ly>=R.plq.y-6&&ly<=R.plq.y+R.plq.h+6){blip(900);showPrices();return}
  const k=R.inst;on[k]=!on[k];if(ch[k])ch[k].gain.setTargetAtTime(on[k]?1:0,AC.currentTime,.03);blip(on[k]?520:380,on[k]?880:240);
});
muteEl.addEventListener('click',()=>{muted=!muted;muteEl.classList.toggle('off',muted);muteEl.setAttribute('aria-label',muted?'Turn sound on':'Mute sound');muteEl.title=muted?'Turn sound on':'Mute sound';toast(muted?'SOUND OFF':'SOUND ON',1300);if(master)master.gain.setTargetAtTime(muted?0:.8,AC.currentTime,.03)});
document.addEventListener('visibilitychange',()=>{if(AC&&!document.hidden&&AC.state==='suspended'&&started)AC.resume()});
})();
</script>
